# Nginx 旁路采集器模板。默认不会随 Monitor 启动；必须在每个 Nginx 节点单独部署。
# Nginx 需把专用脱敏 JSON access log 以只读方式挂载到 /logs。
services:
  nginxcollector:
    image: ghcr.io/yl0711-coder/newapi-monitor-nginxcollector:${NGINXCOLLECTOR_TAG:-latest}
    container_name: nexusapi-nginxcollector
    restart: unless-stopped
    environment:
      NGINXCOLLECTOR_NODE: ${NGINXCOLLECTOR_NODE:?set NGINXCOLLECTOR_NODE}
      NGINXCOLLECTOR_SINK_URL: ${NGINXCOLLECTOR_SINK_URL:?set NGINXCOLLECTOR_SINK_URL}
      NGINXCOLLECTOR_TOKEN: ${NGINXCOLLECTOR_TOKEN:?set NGINXCOLLECTOR_TOKEN}
      NGINXCOLLECTOR_LOG_PATH: /logs/nexusapi_access.jsonl
      NGINXCOLLECTOR_CURSOR_PATH: /data/cursor.json
      NGINXCOLLECTOR_INTERVAL_SECONDS: "5"
      NGINXCOLLECTOR_MAX_LINES: "1000"
      NGINXCOLLECTOR_RETENTION_DAYS: "7"
      # 请求证据是与原分钟汇总独立的持久队列。首次只设 pilot，
      # 现网核对 X-Oneapi-Request-Id 与 logs.request_id 同值后才能改 verified。
      NGINXCOLLECTOR_EVIDENCE_MODE: ${NGINXCOLLECTOR_EVIDENCE_MODE:-off}
      NGINXCOLLECTOR_EVIDENCE_SINK_URL: ${NGINXCOLLECTOR_EVIDENCE_SINK_URL:-}
      NGINXCOLLECTOR_EVIDENCE_HMAC_KEY: ${NGINXCOLLECTOR_EVIDENCE_HMAC_KEY:-}
      NGINXCOLLECTOR_EVIDENCE_HMAC_KEY_ID: ${NGINXCOLLECTOR_EVIDENCE_HMAC_KEY_ID:-}
      NGINXCOLLECTOR_EVIDENCE_OUTBOX_PATH: /evidence/outbox
      NGINXCOLLECTOR_EVIDENCE_OUTBOX_MAX_MIB: ${NGINXCOLLECTOR_EVIDENCE_OUTBOX_MAX_MIB:-256}
      # 标准 error.log 只在节点侧分类，原文不会上传。独立游标/接口，故障不阻塞 access lane。
      NGINXCOLLECTOR_ERROR_ENABLED: ${NGINXCOLLECTOR_ERROR_ENABLED:-false}
      NGINXCOLLECTOR_ERROR_LOG_PATH: /logs/error.log
      NGINXCOLLECTOR_ERROR_CURSOR_PATH: /data/error-cursor.json
      NGINXCOLLECTOR_ERROR_SINK_URL: ${NGINXCOLLECTOR_ERROR_SINK_URL:-}
      NGINXCOLLECTOR_ERROR_TIMEZONE: ${NGINXCOLLECTOR_ERROR_TIMEZONE:-Asia/Shanghai}
      # source v2 默认完全关闭。先单独开 PREPARE 取得 v1 精确边界；
      # 只有 Monitor 对应 node:lane 白名单就绪后，才逐 lane 填入 access 或 error。
      NGINXCOLLECTOR_SOURCE_V2_PREPARE: ${NGINXCOLLECTOR_SOURCE_V2_PREPARE:-false}
      NGINXCOLLECTOR_SOURCE_V2_LANES: ${NGINXCOLLECTOR_SOURCE_V2_LANES:-}
      NGINXCOLLECTOR_SOURCE_V2_BASE_URL: ${NGINXCOLLECTOR_SOURCE_V2_BASE_URL:-}
      NGINXCOLLECTOR_SOURCE_V2_ACCESS_CURSOR_PATH: /data/access-source-v2.json
      NGINXCOLLECTOR_SOURCE_V2_ERROR_CURSOR_PATH: /data/error-source-v2.json
      # 默认只允许 HTTPS。仅当 sink 走已核对的私网直连时才显式设 true。
      NGINXCOLLECTOR_ALLOW_INSECURE_HTTP: ${NGINXCOLLECTOR_ALLOW_INSECURE_HTTP:-false}
    volumes:
      - ${NGINXCOLLECTOR_LOG_DIR:?set NGINXCOLLECTOR_LOG_DIR}:/logs:ro
      - nginxcollector-data:/data
      - nginxcollector-evidence:/evidence
    group_add:
      - ${NGINXCOLLECTOR_LOG_GID:?set NGINXCOLLECTOR_LOG_GID}
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 64m
    cpus: "0.25"
    pids_limit: 64
    stop_grace_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  nginxcollector-data:
  nginxcollector-evidence:
