# Nginx 旁路采集器模板。默认不会随 Monitor 启动；必须在每个 Nginx 节点单独部署。
# Nginx 需把专用脱敏 JSON access log 以只读方式挂载到 /logs。
services:
  nginxcollector:
    image: ghcr.io/yl0711-coder/newapi-monitor-nginxcollector:${NGINXCOLLECTOR_TAG:-latest}
    container_name: nexusapi-nginxcollector
    restart: unless-stopped
    environment:
      NGINXCOLLECTOR_NODE: ${NGINXCOLLECTOR_NODE:?set NGINXCOLLECTOR_NODE}
      NGINXCOLLECTOR_SINK_URL: ${NGINXCOLLECTOR_SINK_URL:?set NGINXCOLLECTOR_SINK_URL}
      NGINXCOLLECTOR_TOKEN: ${NGINXCOLLECTOR_TOKEN:?set NGINXCOLLECTOR_TOKEN}
      NGINXCOLLECTOR_LOG_PATH: /logs/nexusapi_access.jsonl
      NGINXCOLLECTOR_CURSOR_PATH: /data/cursor.json
      NGINXCOLLECTOR_INTERVAL_SECONDS: "5"
      NGINXCOLLECTOR_MAX_LINES: "1000"
      NGINXCOLLECTOR_RETENTION_DAYS: "7"
      # 默认只允许 HTTPS。仅当 sink 走已核对的私网直连时才显式设 true。
      NGINXCOLLECTOR_ALLOW_INSECURE_HTTP: ${NGINXCOLLECTOR_ALLOW_INSECURE_HTTP:-false}
    volumes:
      - ${NGINXCOLLECTOR_LOG_DIR:?set NGINXCOLLECTOR_LOG_DIR}:/logs:ro
      - nginxcollector-data:/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 64m
    cpus: "0.25"
    pids_limit: 64
    stop_grace_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  nginxcollector-data:
