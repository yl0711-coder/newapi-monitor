# 本机真实数据验收覆盖文件。
#
# 必须与 docker-compose.local-acceptance.yml 叠加使用，并通过
# dev/run-local-production-readonly.sh 启动。它只允许把 NEWAPI_LOG_DSN
# 指向宿主机 127.0.0.1 上的 SSH 隧道；数据库账号由启动脚本强制校验为
# monitor_ro。严禁把生产写账号、RDS 公网地址或 NewAPI 管理 API 写入本文件。
#
# 本模式不部署任何线上代码，也不写 NewAPI：
# - MySQL 只通过 monitor_ro 执行 SELECT；
# - 两份 SQLite 都在本机 Docker 数据卷；
# - 登录使用与线上相同的 NewAPI 身份校验；邮件、基础设施探测、上游账户
#   同步、自动修复和 Nginx 写入均关闭；
# - 管理端/Portal 只绑定 127.0.0.1:8100/8101。

services:
  monitor:
    environment:
      NEWAPI_LOG_DSN: ${NEWAPI_LOG_DSN:?请通过受控 env-file 提供 monitor_ro 的本机隧道 DSN}
      # 与线上 Monitor 相同：只用于管理员登录校验、品牌/公开分组读取；Monitor
      # 不持有 NewAPI 管理 Token，也不通过此地址执行管理写操作。
      MONITOR_NEWAPI_BASE_URL: ${MONITOR_PROD_READONLY_NEWAPI_BASE_URL:-https://nexusapi.link}
      MONITOR_LOCAL_SNAPSHOT_ONLY: "false"
      MONITOR_LOCAL_AUTH_BYPASS: "false"
      # 8204 使用 logchain-only 最小只读来源；完整来源 worker 会读取
      # users/tokens/options，不能因旧配置残留而被启动。
      MONITOR_SOURCE_WORKER_ENABLED: "false"
      MONITOR_SOURCE_LEASE_REQUIRED: "true"
      MONITOR_LOGCHAIN_ONLY_SOURCE: "true"
      MONITOR_CUSTOMER_HEALTH_SOURCE_ENABLED: "true"
      # 本机使用独立租约名，避免与线上 Monitor 的源采集租约冲突而
      # 永久停在 standby。租约仍必须获取，只允许一个本机验收实例读源。
      MONITOR_SOURCE_LEASE_NAME: newapi-monitor-local-prod-readonly-source-v1
      MONITOR_USAGE_FACTS_LOCAL_READ_ONLY: "false"
      # 8204 不启动 Usage Facts；客户维护独立 lane 只写本地用户分钟事实。
      MONITOR_USAGE_FACTS_ENABLED: "false"
      MONITOR_USAGE_FACTS_READ_ENABLED: "false"
      MONITOR_USAGE_FACTS_FULL_HISTORY_ENABLED: "false"
      MONITOR_USAGE_FACTS_HISTORY_SOURCE_MODE: unverified
      MONITOR_USAGE_FACTS_HISTORY_SOURCE_EPOCH: "local-logchain-disabled"
      MONITOR_USAGE_FACTS_HISTORY_DELAY_MS: "30000"
      MONITOR_USAGE_FACTS_HISTORY_SOURCE_DUTY_PERCENT: "20"
      MONITOR_USAGE_FACTS_HISTORY_MAX_DISK_USED_PERCENT: "80"
      MONITOR_USAGE_FACTS_HISTORY_MIN_FREE_BYTES: "2147483648"
      # 本机真实只读候选专门验收有界 user×hour×page 导入协议。
      MONITOR_USAGE_FACTS_RAW_PAGE_IMPORT_ENABLED: "true"
      MONITOR_USAGE_FACTS_CLASSIFICATION_MIGRATION_ENABLED: "false"
      # 仅保留有限窗口兼容值；全历史 discovery 以成员来源边界为准。
      MONITOR_USAGE_FACTS_BACKFILL_DAYS: "90"
      MONITOR_USAGE_FACTS_RETENTION_DAYS: "400"
      MONITOR_USAGE_FACTS_HOUR_RETENTION_DAYS: "8"
      MONITOR_USAGE_FACTS_SYNC_MINUTES: "5"
      MONITOR_USAGE_FACTS_PROFILE_SYNC_MINUTES: "5"
      MONITOR_USAGE_FACTS_RECONCILE_MINUTES: "30"

      # 经营核算回填只能在本受控只读模式中显式开启。
      # 默认仍关闭，避免普通验收意外发起历史扫描。
      MONITOR_FINANCE_ENABLED: ${MONITOR_FINANCE_ENABLED:-true}
      MONITOR_FINANCE_FACTS_SYNC_ENABLED: ${MONITOR_FINANCE_FACTS_SYNC_ENABLED:-false}
      # 与拟上线安全值一致，不使用合成验收的 5 秒加速配置。
      MONITOR_USAGE_FACTS_BACKFILL_DELAY_MS: "15000"
      MONITOR_USAGE_FACTS_QUERY_TIMEOUT_SECONDS: "20"
      MONITOR_USAGE_FACTS_LAG_MINUTES: "10"

      # 保留线上主采样频率，以便两个本地端口显示真实的新鲜数据；启动只补最近 1 小时。
      MONITOR_SAMPLE_SECONDS: "60"
      MONITOR_BACKFILL_HOURS: "1"
      MONITOR_STABILITY_ENABLED: "true"
      # 容量规划只读取本机已采集的脱敏事实，不新增来源 worker；真实只读
      # 验收需要显式开启页面，线上默认开关仍不受影响。
      MONITOR_CAPACITY_ENABLED: "true"
      # 与拟上线读模型一致：页面始终读本地 SQLite，缺失小时由限速的单小时
      # monitor_ro 查询补齐。只读、每次一个小时切片，不执行任何线上写操作。
      MONITOR_STABILITY_BACKFILL_ENABLED: "true"
      MONITOR_STABILITY_AUTO_REPAIR: "true"
      MONITOR_BACKGROUND_SOURCE_MIN_START_INTERVAL_MS: "2000"
      MONITOR_STABILITY_BACKFILL_SERVER_MAX_EXECUTION_MS: "8000"
      MONITOR_STABILITY_BACKFILL_SOURCE_DUTY_PERCENT: "20"
      # 真实来源只读验收默认不自动启动全留存扫描；须在单独维护窗口显式改 true。
      MONITOR_STABILITY_CLASSIFICATION_MIGRATION_ENABLED: "false"

      # 问题预警的前置拒绝数据由 Monitor 直接只读 CloudWatch 获取；这不等于
      # 开启邮件报警，邮件断路器仍由 MONITOR_ALERTS_DISABLED 单独控制。
      # 本机验收通过 gitignored .env 注入最小只读 AWS 身份；正式 ECS 部署应改用
      # Task Role/Secrets Manager，不能把下面的实际值写入 compose 或镜像。
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      MONITOR_CLOUDWATCH_LOGS_ENABLED: ${MONITOR_CLOUDWATCH_LOGS_ENABLED:-false}
      MONITOR_CLOUDWATCH_PREROUTE_ENABLED: ${MONITOR_CLOUDWATCH_PREROUTE_ENABLED:-false}
      MONITOR_CLOUDWATCH_PREROUTE_POLL_SECONDS: ${MONITOR_CLOUDWATCH_PREROUTE_POLL_SECONDS:-300}
      MONITOR_CLOUDWATCH_PREROUTE_LOOKBACK_HOURS: ${MONITOR_CLOUDWATCH_PREROUTE_LOOKBACK_HOURS:-168}
      MONITOR_CLOUDWATCH_EVIDENCE_HMAC_KEY: ${MONITOR_CLOUDWATCH_EVIDENCE_HMAC_KEY:-}
      MONITOR_CLOUDWATCH_EVIDENCE_HMAC_KEY_ID: ${MONITOR_CLOUDWATCH_EVIDENCE_HMAC_KEY_ID:-}
      # CloudWatch Nginx 直采与前置拒绝一样，不能依赖旧的 MONITOR_PROD_RO_* 别名；
      # 显式透传后，按 compose 重建仍会保持当前全链路采集开关。
      MONITOR_CLOUDWATCH_NGINX_ENABLED: ${MONITOR_CLOUDWATCH_NGINX_ENABLED:-false}
      MONITOR_CLOUDWATCH_NGINX_POLL_SECONDS: ${MONITOR_CLOUDWATCH_NGINX_POLL_SECONDS:-300}
      MONITOR_CLOUDWATCH_NGINX_LOOKBACK_HOURS: ${MONITOR_CLOUDWATCH_NGINX_LOOKBACK_HOURS:-168}

      # 所有可能向外部系统写入或主动探测的能力保持关闭。
      MONITOR_ALERTS_DISABLED: "true"
      MONITOR_INFRA_ENABLED: "false"
      MONITOR_INFRA_SNAPSHOT_READ_ONLY: "true"
      MONITOR_UPSTREAM_SYNC_ENABLED: "false"
      MONITOR_UPSTREAM_USAGE_SYNC_ENABLED: "false"
      MONITOR_UPSTREAM_ERRORLOG_SYNC_ENABLED: "false"
      MONITOR_UPSTREAM_ERRORLOG_DOMAINS: ""
      MONITOR_UPSTREAM_PRICING_LEDGER_ENABLED: "false"
      MONITOR_NGINX_ENABLED: "false"
      MONITOR_HEARTBEAT_URL: ""

    extra_hosts:
      - "host.docker.internal:host-gateway"
