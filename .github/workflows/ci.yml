name: CI

on:
  push:
    branches: [main, dev]
    tags: ['v*']
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.6'
      # CLI is pinned and isolated from application dependencies. No action licence
      # or production credentials required; never upload reports containing secrets.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned secret scanner outside the application module
        run: GOBIN="$RUNNER_TEMP/security-tools" go install github.com/zricethezav/gitleaks/v8@v8.30.0
      - name: Verify secret policy positive and negative controls
        run: node dev/check-secret-policy.mjs "$RUNNER_TEMP/security-tools/gitleaks"
      - name: Scan repository history for secrets (redacted)
        run: '"$RUNNER_TEMP/security-tools/gitleaks" git --config .gitleaks.toml --redact=100 --no-banner --ignore-gitleaks-allow --log-opts="--all" .'

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # 与候选镜像构建链对齐到已修补的 Go 版本。不使用模糊的
          # 1.25，否则 runner 可能解析到存在可达标准库漏洞的 1.25.12。
          go-version: '1.26.6'
      - run: go vet ./...
      - name: Test isolated AWS IAM registration bridge without credentials
        run: python3 -m unittest discover -s deploy/ecs-log-bridge -v
      - name: Test offline ECS cutover and rollback guard without credentials
        run: python3 -m unittest discover -s dev -p 'test_ecs_cutover_preflight.py' -v
      - name: Test local image runner safety without Docker or credentials
        run: python3 -m unittest discover -s dev -p 'test_ecs_image_acceptance.py' -v
      - name: Test offline ECS task contract and isolated IAM template
        run: |
          python3 -m unittest discover -s dev -p 'test_ecs_task*.py' -v
          python3 -m unittest discover -s dev -p 'test_ecs_acceptance*.py' -v
          python3 -m unittest discover -s dev -p 'test_ecs_split*.py' -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test dashboard rendering states without network
        run: node --test dev/tests/*.test.mjs
      - name: Reject unmaintained OpenPGP dependencies
        run: node dev/check-dependency-policy.mjs
      - name: Verify every monitor test belongs to exactly one race shard
        run: go test -list . ./monitor | node dev/check-race-shards.mjs
      # monitor 包的 1000+ 个测试由下方 race-monitor 作业分片执行。这里继续
      # 覆盖其余全部包，避免新增包静默逃离竞态检测。
      - name: Test non-monitor packages with race detector
        run: |
          mapfile -t packages < <(go list ./... | grep -v '/monitor$')
          test "${#packages[@]}" -gt 0
          go test -race -timeout 20m "${packages[@]}"
      - name: Check reachable Go vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.64.8
          install-mode: goinstall # 用 runner 的 Go 现编译,避免预编译版 Go 低于 go.mod 目标版本
      # 放在代码测试之后：探针会在工作树创建假数据，不能让它影响 Go 测试环境。
      - name: Verify Docker build context isolation
        run: |
          mkdir -p .local-data tools data secrets .context-probe/nested
          touch .local-data/ci-sensitive.db
          touch tools/ci-local-tool.txt
          touch data/ci-runtime.db
          touch secrets/ci-secret.env
          touch .env .env.local ci-sensitive.db ci-secret.env
          touch .context-probe/nested/ci-sensitive.db
          touch .context-probe/nested/ci-secret.env
          touch .context-probe/nested/.env.production
          touch .context-probe/nested/ci-sensitive.db-journal
          touch .context-probe/nested/ci-sensitive.db-wal
          touch .context-probe/nested/ci-sensitive.db-shm
          touch .context-probe/nested/ci-sensitive.db.backup
          touch .context-probe/nested/ci-sensitive.sqlite
          touch .context-probe/nested/ci-sensitive.sqlite3
          touch .context-probe/nested/ci-sensitive.sqlite-wal
          touch .context-probe/nested/ci-private.pem
          touch .context-probe/nested/ci-private.key
          touch .context-probe/nested/ci-client.p12
          touch .context-probe/nested/ci-client.pfx
          touch local-untracked.txt
          touch .context-probe/nested/customer-export.csv
          touch monitor/ci-local-config.json
          docker build -f .github/Dockerfile.context-check -t newapi-monitor-context-audit:${{ github.run_id }} .
          docker run --rm --entrypoint sh newapi-monitor-context-audit:${{ github.run_id }} -ec '
            test -e /context/go.mod &&
            test -e /context/main.go &&
            test -e /context/monitor/page.html &&
            test -e /context/cmd/hostagent/main.go &&
            test -e /context/cmd/nginxcollector/main.go &&
            test ! -e /context/.local-data &&
            test ! -e /context/tools &&
            test ! -e /context/data &&
            test ! -e /context/secrets &&
            test ! -e /context/.env &&
            test ! -e /context/.env.local &&
            test ! -e /context/ci-sensitive.db &&
            test ! -e /context/ci-secret.env &&
            test ! -e /context/.context-probe/nested/ci-sensitive.db &&
            test ! -e /context/.context-probe/nested/ci-secret.env &&
            test ! -e /context/.context-probe/nested/.env.production &&
            test ! -e /context/.context-probe/nested/ci-sensitive.db-journal &&
            test ! -e /context/.context-probe/nested/ci-sensitive.db-wal &&
            test ! -e /context/.context-probe/nested/ci-sensitive.db-shm &&
            test ! -e /context/.context-probe/nested/ci-sensitive.db.backup &&
            test ! -e /context/.context-probe/nested/ci-sensitive.sqlite &&
            test ! -e /context/.context-probe/nested/ci-sensitive.sqlite3 &&
            test ! -e /context/.context-probe/nested/ci-sensitive.sqlite-wal &&
            test ! -e /context/.context-probe/nested/ci-private.pem &&
            test ! -e /context/.context-probe/nested/ci-private.key &&
            test ! -e /context/.context-probe/nested/ci-client.p12 &&
            test ! -e /context/.context-probe/nested/ci-client.pfx &&
            test ! -e /context/local-untracked.txt &&
            test ! -e /context/.context-probe/nested/customer-export.csv &&
            test ! -e /context/monitor/ci-local-config.json
          '

  # monitor 是单个 Go 包，go test 无法在包内自动并行分片。按测试名称首字母
  # 划分成四个互斥且完整的集合，既保留全量 race 覆盖，也让每个分片拥有独立
  # 的 20 分钟卡死保护，避免共享 runner 变慢时触发单包累计超时。
  race-monitor:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: a-f
            pattern: '^Test[A-F]'
          - shard: g-n
            pattern: '^Test[G-N]'
          - shard: o-s
            pattern: '^Test[O-S]'
          - shard: t-z
            pattern: '^(Test[T-Z]|Test[^A-Z]|Test$|Example|Fuzz)'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.6'
      - name: Verify shard is non-empty
        env:
          TEST_PATTERN: ${{ matrix.pattern }}
        run: |
          test_count="$(go test -list "$TEST_PATTERN" ./monitor | grep -Ec '^(Test|Example|Fuzz)')"
          test "$test_count" -gt 0
          echo "monitor race shard ${{ matrix.shard }}: $test_count tests"
      - name: Test monitor shard with race detector
        env:
          TEST_PATTERN: ${{ matrix.pattern }}
        run: |
          go build -o "$RUNNER_TEMP/nginxcollector" ./cmd/nginxcollector
          MONITOR_TEST_NGINX_COLLECTOR_BIN="$RUNNER_TEMP/nginxcollector" go test -race -timeout 20m -run "$TEST_PATTERN" ./monitor

  # PRs are scanned too. No registry write credentials in the build/scan job.
  # All three images must pass before ANY image is published. Transfer the exact
  # scanned image, not a rebuild with potentially different base packages.
  image-security:
    needs: [test, race-monitor, secrets]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: newapi-monitor
            dockerfile: Dockerfile
          - image: newapi-monitor-hostagent
            dockerfile: cmd/hostagent/Dockerfile
          - image: newapi-monitor-nginxcollector
            dockerfile: cmd/nginxcollector/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - name: Candidate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Build local candidate only
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          # Reuse Go build cache, never yesterday's apk security-upgrade layer.
          pull: true
          no-cache-filters: runtime
          load: true
          push: false
          tags: monitor-security:${{ matrix.image }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Block high and critical runtime OS vulnerabilities (including unfixed)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          version: v0.74.0
          image-ref: monitor-security:${{ matrix.image }}
          scanners: vuln
          vuln-type: os
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '1'
          timeout: 10m
      - name: Report remaining runtime OS advisories
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          version: v0.74.0
          image-ref: monitor-security:${{ matrix.image }}
          scanners: vuln
          vuln-type: os
          severity: UNKNOWN,LOW,MEDIUM
          ignore-unfixed: false
          exit-code: '0'
          timeout: 10m
      - name: Save scanned artifact
        if: github.event_name != 'pull_request'
        env:
          IMAGE_NAME: ${{ matrix.image }}
        run: docker save "monitor-security:$IMAGE_NAME" -o "$RUNNER_TEMP/scanned-image.tar"
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: scanned-${{ matrix.image }}
          path: ${{ runner.temp }}/scanned-image.tar
          if-no-files-found: error
          retention-days: 1

  build-push:
    needs: [test, race-monitor, secrets, image-security]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        image: [newapi-monitor, newapi-monitor-hostagent, newapi-monitor-nginxcollector]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: scanned-${{ matrix.image }}
          path: ${{ runner.temp }}/scanned
      - name: Load exact scanned image
        run: docker load -i "$RUNNER_TEMP/scanned/scanned-image.tar"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Publish exact scanned image without rebuilding
        env:
          IMAGE_NAME: ${{ matrix.image }}
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          test -n "$IMAGE_TAGS"
          while IFS= read -r tag; do
            test -n "$tag"
            docker tag "monitor-security:$IMAGE_NAME" "$tag"
            docker push "$tag"
          done <<< "$IMAGE_TAGS"

  # Host-side safety tools are not container images. Build them on the same
  # tested Linux revision and publish checksums so production never receives
  # an untraceable binary built by hand on an operator laptop.
  build-nginx-ops-tools:
    needs: [test, race-monitor, secrets, image-security]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.6'
      - name: Build static Linux amd64 tools
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: amd64
        run: |
          mkdir -p dist
          go build -trimpath -ldflags='-s -w' -o dist/nexusapi-nginxreopen ./cmd/nginxreopen
          go build -trimpath -ldflags='-s -w' -o dist/nexusapi-nginxcursoraudit ./cmd/nginxcursoraudit
          sha256sum dist/nexusapi-nginxreopen dist/nexusapi-nginxcursoraudit > dist/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: nginx-ops-tools-linux-amd64
          path: dist/
          if-no-files-found: error
          retention-days: 14
