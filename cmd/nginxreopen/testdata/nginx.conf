user nginx;
worker_processes 2;
pid /tmp/nginx.pid;
error_log /var/log/nexusapi-monitor/error.log warn;

events {
    worker_connections 128;
}

http {
    access_log /var/log/nexusapi-monitor/nexusapi_access.jsonl combined;
    server {
        listen 8080;
        location = /api/status {
            return 403;
        }
    }
}
